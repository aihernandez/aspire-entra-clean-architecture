<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database schema · dbo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 880px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Database schema · SQL Server</p>
    <h1>Database schema · dbo</h1>

        <desc id="database-schema-desc">Physical SQL Server schema with two tables, dbo.Users and dbo.TodoItems, where TodoItems.UserId references Users.Id with ON DELETE CASCADE and Users is unique on the Entra object and tenant ID pair.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="40" y="68" width="320" height="24" fill="rgba(45,49,66,0.02)"/>

        <text x="52" y="156" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Email</text>
        <text x="348" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">nvarchar(256)</text>

        <rect x="40" y="164" width="320" height="24" fill="rgba(45,49,66,0.02)"/>

        <rect x="520" y="40" width="320" height="264" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="40" width="320" height="28" rx="6" fill="rgba(235,108,54,0.08)" stroke="none"/>

        <text x="532" y="84" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Id</text>

        <text x="828" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uniqueidentifier</text>

        <rect x="520" y="116" width="320" height="24" fill="rgba(45,49,66,0.02)"/>
        <text x="532" y="132" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Description</text>
        <text x="828" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">nvarchar(max)</text>

        <text x="532" y="156" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Priority</text>
        <text x="828" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">int</text>

        <rect x="520" y="164" width="320" height="24" fill="rgba(45,49,66,0.02)"/>

        <text x="532" y="204" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">DueDate</text>

        <rect x="268" y="368" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
