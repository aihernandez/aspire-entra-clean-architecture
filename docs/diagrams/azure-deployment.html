<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure deployment · prod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 992px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Bicep</p>
    <h1>Azure deployment · prod</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 992 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="azure-deployment-title azure-deployment-desc">
        <title id="azure-deployment-title">Azure deployment · prod</title>
        <desc id="azure-deployment-desc">Production deployment from the Bicep templates: Azure Front Door Premium with WAF reaches the API and web container apps in an internal Container Apps environment over Private Link, the API reaches Azure SQL through a private endpoint with its own managed identity and Entra-only authentication, Key Vault sits behind a private endpoint with no consumer yet, and each app pulls its image from Azure Container Registry with its own managed identity.</desc>

          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn first) -->
        <rect x="40" y="40" width="192" height="260" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="52" y="44" width="76" height="12" fill="#f5f5f5"/>
        <text x="90" y="53" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EDGE · GLOBAL</text>

        <rect x="296" y="40" width="304" height="260" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="308" y="44" width="228" height="12" fill="#f5f5f5"/>
        <text x="422" y="53" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VNET / CONTAINER APPS · 10.42.0.0/23</text>

        <rect x="680" y="40" width="272" height="260" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="692" y="44" width="228" height="12" fill="#f5f5f5"/>
        <text x="806" y="53" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VNET / PRIVATE ENDPOINTS · 10.42.2.0/24</text>

        <!-- Network paths (behind nodes) -->
        <!-- Internet -> Front Door -->
        <line x1="136" y1="84" x2="136" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <path d="M 216,160 H 256 Q 264,160 264,152 V 130 Q 264,122 272,122 H 344" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- Front Door -> ca-web over Private Link (focal) -->
        <path d="M 216,196 H 256 Q 264,196 264,204 V 230 Q 264,238 272,238 H 344" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- ca-api -> Azure SQL (Entra auth with the API managed identity) -->
        <line x1="552" y1="122" x2="704" y2="122" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- ACR -> ca-web (image pull) -->
        <line x1="448" y1="344" x2="448" y2="280" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <!-- ACR -> ca-api (image pull) -->
        <path d="M 552,386 H 568 Q 576,386 576,378 V 151 Q 576,143 568,143 H 552" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

        <!-- Path labels -->
        <text x="136" y="77" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INTERNET</text>
        <rect x="144" y="96" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="172" y="105" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS:443</text>

        <rect x="288" y="104" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="113" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/api/*</text>

        <rect x="296" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="253" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/*</text>

        <rect x="588" y="104" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="113" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TDS:1433 · MI</text>

        <rect x="456" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="325" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL · ID-WEB</text>

        <rect x="584" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="624" y="325" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PULL · ID-API</text>

        <text x="80" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
        <text x="136" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Front Door Premium</text>
        <rect x="64" y="172" width="144" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="72" y="188" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">WAF</text>
        <text x="200" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Prevention</text>

        <!-- Node: ca-api -->
        <rect x="344" y="80" width="208" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="80" width="208" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="352" y="88" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="366" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <rect x="504" y="88" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="524" y="97" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x2–10</text>
        <text x="448" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ca-api</text>
        <rect x="352" y="132" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="360" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Web.Api</text>
        <text x="536" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:8080 · 0.5 vCPU</text>

        <!-- Node: ca-web -->
        <rect x="344" y="196" width="208" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="196" width="208" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="352" y="204" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="366" y="213" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <rect x="504" y="204" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="524" y="213" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x2–10</text>
        <text x="448" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ca-web</text>
        <rect x="352" y="248" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="360" y="264" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Angular SPA</text>
        <text x="536" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">:80 · 0.25 vCPU</text>

        <!-- Node: Azure SQL -->
        <rect x="704" y="80" width="224" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="80" width="224" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="88" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="740" y="97" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="816" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Azure SQL Database</text>
        <rect x="712" y="132" width="208" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="720" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">app</text>
        <text x="912" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">GP_Gen5_2 · Entra-only · ZR</text>

        <!-- Node: Key Vault -->
        <rect x="704" y="196" width="224" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="196" width="224" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="204" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="740" y="213" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="816" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Key Vault</text>
        <rect x="712" y="248" width="208" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="720" y="264" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">secrets</text>
        <text x="912" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">no consumer yet</text>

        <!-- Node: Container Registry (outside the VNet) -->
        <rect x="344" y="344" width="208" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="344" width="208" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="352" y="352" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="380" y="361" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
        <text x="448" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container Registry</text>
        <rect x="352" y="396" width="192" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="360" y="412" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">api, web</text>
        <text x="536" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Standard · public</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="952" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Container app · min–max replicas</text>

        <rect x="240" y="488" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="260" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Managed service</text>

        <line x1="360" y1="492" x2="388" y2="492" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="396" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Private Link origin, approve after deploy</text>

        <line x1="608" y1="492" x2="636" y2="492" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="644" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cross-zone call</text>

        <line x1="744" y1="492" x2="772" y2="492" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
