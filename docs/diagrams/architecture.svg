<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Clean Architecture overview</title>
        <desc id="architecture-desc">The Angular SPA signs in with Microsoft Entra ID and calls Web.Api with a bearer token; inside the backend process Web.Api references Application and Infrastructure, Infrastructure implements the interfaces Application owns, Application depends on Domain, every layer references SharedKernel, and Infrastructure talks to Entra ID, SQL Server and SMTP.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn first) -->
        <rect x="40" y="64" width="200" height="448" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="52" y="68" width="56" height="12" fill="#f5f5f5"/>
        <text x="80" y="77" fill="#2d3142" fill-opacity="0.55" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

        <rect x="280" y="64" width="504" height="448" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="292" y="68" width="148" height="12" fill="#f5f5f5"/>
        <text x="366" y="77" fill="#2d3142" fill-opacity="0.55" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKEND · ONE PROCESS</text>

        <rect x="856" y="64" width="184" height="448" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="868" y="68" width="112" height="12" fill="#f5f5f5"/>
        <text x="924" y="77" fill="#2d3142" fill-opacity="0.55" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SERVICES</text>

        <!-- Connectors (behind nodes) -->
        <!-- SPA -> Entra ID: sign-in (over the top of every zone) -->
        <path d="M 140,96 V 48 Q 140,40 148,40 H 992 Q 1000,40 1000,48 V 96" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- SPA -> Web.Api: HTTPS with bearer token -->
        <line x1="224" y1="120" x2="440" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- Web.Api -> Application -->
        <path d="M 440,144 H 412 Q 404,144 404,152 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Web.Api -> Infrastructure (composition root) -->
        <path d="M 640,144 H 660 Q 668,144 668,152 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Infrastructure -> Application: implements its interfaces (focal) -->
        <line x1="576" y1="252" x2="504" y2="252" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#architecture-arrow-accent)"/>
        <!-- Application -> Domain -->
        <line x1="404" y1="288" x2="404" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Infrastructure -> Entra ID: token signing keys -->
        <path d="M 736,216 V 140 Q 736,132 744,132 H 880" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- Infrastructure -> SQL Server -->
        <line x1="760" y1="240" x2="880" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- Infrastructure -> SMTP -->
        <path d="M 760,264 H 812 Q 820,264 820,272 V 364 Q 820,372 828,372 H 880" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

        <!-- Connector labels -->
        <rect x="496" y="22" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="540" y="31" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGN-IN · PKCE</text>

        <rect x="292" y="102" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="340" y="111" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS · BEARER</text>

        <rect x="508" y="234" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="540" y="243" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMPLEMENTS</text>

        <rect x="772" y="114" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="812" y="123" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGNING KEYS</text>

        <rect x="782" y="222" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="231" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EF CORE · TDS</text>

        <rect x="724" y="306" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="315" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAILKIT · SMTP</text>

        <!-- Node: Angular SPA -->
        <rect x="56" y="96" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="96" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="104" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="78" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="140" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Angular 22</text>
        <text x="140" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MSAL · Kiota client</text>

        <!-- Node: Web.Api -->
        <rect x="440" y="96" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="96" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="448" y="104" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="462" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="540" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web.Api</text>
        <text x="540" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoints · middleware</text>

        <!-- Node: Application (focal) -->
        <rect x="304" y="216" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="216" width="200" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="312" y="224" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="330" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="404" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application</text>
        <text x="404" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CQRS handlers · abstractions</text>

        <!-- Node: Infrastructure -->
        <rect x="576" y="216" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="216" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="584" y="224" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="612" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADAPTERS</text>
        <text x="668" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Infrastructure</text>
        <text x="668" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EF Core · Entra · MailKit</text>

        <!-- Node: Domain -->
        <rect x="304" y="336" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="336" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="312" y="344" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="330" y="353" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="404" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Domain</text>
        <text x="404" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entities · domain events</text>

        <!-- Node: SharedKernel (foundation band) -->
        <rect x="304" y="440" width="456" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="440" width="456" height="48" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="312" y="448" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="336" y="457" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED</text>
        <text x="532" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SharedKernel</text>
        <text x="532" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Result/Error · Entity · PermissionNames · referenced by every layer</text>

        <!-- Node: Microsoft Entra ID -->
        <rect x="880" y="96" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="96" width="144" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="888" y="104" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
        <text x="902" y="113" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
        <text x="952" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Microsoft Entra ID</text>
        <text x="952" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tokens · app roles</text>

        <!-- Node: SQL Server -->
        <rect x="880" y="216" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="216" width="144" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="888" y="224" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
        <text x="898" y="233" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="952" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQL Server</text>
        <text x="952" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Users · TodoItems</text>

        <!-- Node: SMTP -->
        <rect x="880" y="336" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="336" width="144" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="888" y="344" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
        <text x="906" y="353" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SMTP</text>
        <text x="952" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SMTP server</text>
        <text x="952" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MailPit in development</text>

        <!-- Legend -->
        <line x1="40" y1="544" x2="1040" y2="544" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="576" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Owns the interfaces</text>

        <rect x="180" y="576" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Project in this repo</text>

        <rect x="320" y="576" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="340" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External service</text>

        <line x1="460" y1="580" x2="488" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="496" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Project reference</text>

        <line x1="612" y1="580" x2="640" y2="580" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#architecture-arrow-accent)"/>
        <text x="648" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency inversion</text>

        <line x1="780" y1="580" x2="808" y2="580" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <text x="816" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runtime call across a boundary</text>
      </svg>
